<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AI Quiz Generator</h1>

        <p>
            Klistra in kursmaterial och generera ett quiz.
        </p>

        <textarea
            id="courseText"
            placeholder="Klistra in kursmaterial här...">
        </textarea>

        <button id="generateBtn">
            Generera Quiz
        </button>

        <div id="loading"></div>

        <div id="quizContainer"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
